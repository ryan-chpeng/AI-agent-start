<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AlmaLinux 10 教學安裝步驟</title>
<meta name="description" content="在 Windows 上用 WSL2 建立獨立、可重置的 AlmaLinux 10 練習環境，含使用者、加固與基準還原。">
<style>
  :root {
    --bg: #ffffff; --fg: #1f2328; --muted: #59636e; --line: #d1d9e0;
    --accent: #0b5cad; --code-bg: #f6f8fa; --btn-bg: #ffffff; --quote: #eef4fb;
    --warn-line: #bf8700;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0d1117; --fg: #e6edf3; --muted: #9198a1; --line: #30363d;
      --accent: #58a6ff; --code-bg: #161b22; --btn-bg: #21262d; --quote: #121d2f;
      --warn-line: #d29922;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0d1117; --fg: #e6edf3; --muted: #9198a1; --line: #30363d;
    --accent: #58a6ff; --code-bg: #161b22; --btn-bg: #21262d; --quote: #121d2f;
    --warn-line: #d29922;
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    margin: 0; background: var(--bg); color: var(--fg);
    font: 16px/1.7 -apple-system, "Segoe UI", "Noto Sans TC", "Microsoft JhengHei", sans-serif;
  }
  .wrap { max-width: 860px; margin: 0 auto; padding: 24px 16px 80px; }
  header.bar {
    display: flex; justify-content: space-between; align-items: center; gap: 12px;
    padding: 10px 16px; border-bottom: 1px solid var(--line); font-size: 14px; color: var(--muted);
  }
  header.bar a { color: var(--accent); text-decoration: none; }
  header.bar button {
    background: var(--btn-bg); color: var(--fg); border: 1px solid var(--line);
    border-radius: 6px; padding: 4px 10px; cursor: pointer; font: inherit;
  }
  h1 { font-size: 1.9rem; line-height: 1.3; margin: 8px 0 12px; }
  h2 { font-size: 1.4rem; margin: 2.2em 0 0.6em; padding-top: 0.4em; border-top: 1px solid var(--line); }
  h1 + p, h2 + p { margin-top: 0.4em; }
  a { color: var(--accent); }
  p, li { overflow-wrap: anywhere; }
  code {
    font: 0.92em ui-monospace, "Cascadia Mono", Consolas, monospace;
    background: var(--code-bg); border: 1px solid var(--line); border-radius: 4px; padding: 0.1em 0.35em;
  }
  .codewrap { position: relative; margin: 1em 0; }
  pre {
    margin: 0; padding: 14px 16px; background: var(--code-bg); border: 1px solid var(--line);
    border-radius: 8px; overflow-x: auto; line-height: 1.5;
  }
  pre code { background: none; border: 0; padding: 0; font-size: 0.9rem; white-space: pre; }
  .copy {
    position: absolute; top: 8px; right: 8px; font-size: 12px; padding: 3px 9px;
    background: var(--btn-bg); color: var(--fg); border: 1px solid var(--line);
    border-radius: 6px; cursor: pointer; opacity: 0.85;
  }
  .copy:hover { opacity: 1; }
  table { border-collapse: collapse; width: 100%; margin: 1em 0; display: block; overflow-x: auto; }
  th, td { border: 1px solid var(--line); padding: 8px 12px; text-align: left; vertical-align: top; }
  th { background: var(--code-bg); }
  blockquote {
    margin: 1em 0; padding: 8px 16px; background: var(--quote);
    border-left: 4px solid var(--warn-line); border-radius: 0 6px 6px 0;
  }
  blockquote p { margin: 0.4em 0; }
  nav.toc {
    margin: 18px 0 8px; padding: 12px 16px; border: 1px solid var(--line); border-radius: 8px;
    background: var(--code-bg); font-size: 15px;
  }
  nav.toc strong { display: block; margin-bottom: 4px; }
  nav.toc ol { margin: 0; padding-left: 0; list-style: none; columns: 2; column-gap: 28px; }
  nav.toc li { break-inside: avoid; }
  @media (max-width: 560px) { nav.toc ol { columns: 1; } }
  nav.toc a { text-decoration: none; }
  footer { margin-top: 3em; padding-top: 1em; border-top: 1px solid var(--line); color: var(--muted); font-size: 14px; }
  #status { color: var(--muted); }
</style>
</head>
<body>
<header class="bar">
  <span>AlmaLinux 10 教學安裝步驟</span>
  <span>
    <a href="https://github.com/ryan-chpeng/alma-wsl-training">GitHub 原始碼</a>
    <button id="theme" type="button" aria-label="切換深色或淺色模式">深色／淺色</button>
  </span>
</header>
<main class="wrap">
  <div id="status">載入中…</div>
  <article id="content"></article>
  <noscript>此頁需要 JavaScript 才能顯示。請直接閱讀 <a href="README.md">README.md</a>。</noscript>
  <footer>
    內容以 <a href="https://creativecommons.org/licenses/by/4.0/">CC BY 4.0</a> 授權，轉載或改作請標示出處。
    原稿：<a href="README.md">README.md</a>
  </footer>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script>
(function () {
  var statusEl = document.getElementById('status');
  var content = document.getElementById('content');

  // theme toggle (remembered per browser; works without storage)
  var root = document.documentElement;
  try { var saved = localStorage.getItem('theme'); if (saved) root.setAttribute('data-theme', saved); } catch (e) {}
  document.getElementById('theme').addEventListener('click', function () {
    var dark = window.matchMedia('(prefers-color-scheme: dark)').matches;
    var cur = root.getAttribute('data-theme') || (dark ? 'dark' : 'light');
    var next = cur === 'dark' ? 'light' : 'dark';
    root.setAttribute('data-theme', next);
    try { localStorage.setItem('theme', next); } catch (e) {}
  });

  function copyText(text) {
    if (navigator.clipboard && window.isSecureContext) return navigator.clipboard.writeText(text);
    return new Promise(function (resolve, reject) {
      var ta = document.createElement('textarea');
      ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
      document.body.appendChild(ta); ta.select();
      try { document.execCommand('copy') ? resolve() : reject(); } catch (e) { reject(e); }
      document.body.removeChild(ta);
    });
  }

  function decorate() {
    // copy buttons on every code block
    content.querySelectorAll('pre').forEach(function (pre) {
      var wrap = document.createElement('div'); wrap.className = 'codewrap';
      pre.parentNode.insertBefore(wrap, pre); wrap.appendChild(pre);
      var btn = document.createElement('button');
      btn.type = 'button'; btn.className = 'copy'; btn.textContent = '複製';
      btn.addEventListener('click', function () {
        copyText(pre.innerText).then(function () {
          btn.textContent = '已複製'; setTimeout(function () { btn.textContent = '複製'; }, 1500);
        }, function () {
          btn.textContent = '請手動複製'; setTimeout(function () { btn.textContent = '複製'; }, 2000);
        });
      });
      wrap.appendChild(btn);
    });

    // table of contents from h2 headings
    var h2s = content.querySelectorAll('h2');
    if (h2s.length > 2) {
      var nav = document.createElement('nav'); nav.className = 'toc';
      nav.innerHTML = '<strong>目錄</strong>';
      var ol = document.createElement('ol');
      h2s.forEach(function (h, i) {
        h.id = 'sec-' + (i + 1);
        var li = document.createElement('li'); var a = document.createElement('a');
        a.href = '#' + h.id; a.textContent = h.textContent;
        li.appendChild(a); ol.appendChild(li);
      });
      nav.appendChild(ol);
      h2s[0].parentNode.insertBefore(nav, h2s[0]);
    }

    // external links open in a new tab
    content.querySelectorAll('a[href^="http"]').forEach(function (a) { a.target = '_blank'; a.rel = 'noopener'; });
  }

  if (typeof marked === 'undefined') {
    statusEl.innerHTML = '無法載入渲染元件（可能被網路擋住）。請直接閱讀 <a href="README.md">README.md</a>。';
    return;
  }
  fetch('README.md', { cache: 'no-cache' })
    .then(function (r) { if (!r.ok) throw new Error(r.status); return r.text(); })
    .then(function (md) {
      content.innerHTML = marked.parse(md);
      statusEl.remove();
      decorate();
      if (location.hash) { var el = document.querySelector(location.hash); if (el) el.scrollIntoView(); }
    })
    .catch(function () {
      statusEl.innerHTML = '讀取內容失敗。請直接閱讀 <a href="README.md">README.md</a>（若是用 file:// 本機開啟，瀏覽器會擋讀檔，請改看 GitHub 上的網頁版）。';
    });
})();
</script>
</body>
</html>
